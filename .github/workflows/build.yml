name: Build Real Fluids

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realfluids-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository currently stores the complete project in this archive.
      - name: Extract project source
        run: |
          test -f RealFluids-1.0.0.zip
          unzip -q RealFluids-1.0.0.zip -d source
          test -f source/RealFluids/build.gradle
          test -f source/RealFluids/src/main/resources/fabric.mod.json

      - name: Run fluid simulation tests
        working-directory: source/RealFluids
        run: |
          mkdir -p build/simtests
          javac -encoding UTF-8 -d build/simtests \
            src/main/java/net/realfluids/sim/*.java \
            tools/SimTests.java \
            tools/FluidPreview.java
          java -cp build/simtests SimTests

      - name: Generate preview images
        working-directory: source/RealFluids
        run: |
          mkdir -p build/previews
          java -Djava.awt.headless=true -cp build/simtests FluidPreview build/previews

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Fabric mod JAR
        working-directory: source/RealFluids
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: realfluids-mod
          path: |
            source/RealFluids/build/libs/*.jar
            !source/RealFluids/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload sources and previews
        uses: actions/upload-artifact@v4
        with:
          name: realfluids-build-extras
          path: |
            source/RealFluids/build/libs/*-sources.jar
            source/RealFluids/build/previews/*.png
          if-no-files-found: warn
          retention-days: 30
